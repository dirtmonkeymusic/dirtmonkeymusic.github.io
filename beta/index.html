<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dirt Monkey Beta</title>
  <!-- HIDDEN: the beta tester page. Not linked anywhere and not in sitemap.xml. Share the address by hand. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="beta-page">
  <a class="skip" href="#main">Skip to content</a>

  <header class="beta-header">
    <span class="logo-mark logo-mark-small">
        <span class="logo-stack" aria-hidden="true"><span class="logo-aura logo-aura-pink"><span class="logo-shape"></span></span><span class="logo-aura logo-aura-cyan"><span class="logo-shape"></span></span><span class="logo-fill"></span></span>
        <img class="logo-crisp" src="/assets/dirt-monkey-logo-1360.webp" alt="Dirt Monkey" width="1360" height="264">
      </span>
  </header>

  <main id="main">
    <!-- LOCK: the public part. The beta content is encrypted in /assets/beta/content.enc and
         js/beta.js shows it after a good invite code (codes: node dev/beta-codes.js). -->
    <section class="section section-first beta-lock" aria-labelledby="beta-lock-title" data-beta-lock>
      <div class="wrap wrap-narrow">
        <div class="suite-card beta-welcome">
          <picture class="beta-monkey">
            <source type="image/webp" srcset="/assets/monkey-cyan.webp">
            <img src="/assets/monkey-cyan.png" alt="" width="512" height="512" decoding="async">
          </picture>
          <h1 id="beta-lock-title" class="beta-lock-title">Beta testers: enter your invite code</h1>
          <form class="beta-form" data-beta-form autocomplete="off">
            <label class="visually-hidden" for="beta-code">Invite code</label>
            <input id="beta-code" class="beta-input" name="code" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="MONKEY-XXXXXX" required data-beta-code>
            <button class="btn btn-demo beta-unlock" type="submit" data-beta-unlock>Unlock</button>
          </form>
          <p class="beta-error" role="alert" data-beta-error hidden>That code didn't work. Check it and try again.</p>
        </div>
      </div>
    </section>
    <div data-beta-content hidden></div>
  </main>

  <footer class="site-footer beta-footer">
    <div class="wrap footer-inner">
      <ul class="footer-links">
        <li><a href="/privacy/">Privacy</a></li>
      </ul>
    </div>
  </footer>
  <script src="/js/beta.js" defer></script>
</body>
</html>
